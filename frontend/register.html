<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your free Rapid Rescue account." />
    <title>Register | Rapid Rescue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/register.css" />
</head>

<body class="auth-page-body register-page">
    <nav class="navbar scrolled"
        style="background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:var(--border-glass)">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon"><i class="fas fa-ambulance"></i></div>
                <span class="brand-text">Rapid<span class="brand-accent">Rescue</span></span>
            </a>
        </div>
    </nav>

    <div class="auth-card register-card">
        <div class="auth-logo register-logo">
            <div class="brand-icon"><i class="fas fa-ambulance"></i></div>
            <span class="brand-text">Rapid<span class="brand-accent">Rescue</span></span>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Free forever. Get faster bookings and priority dispatch.</p>

        <div class="benefits-strip">
            <div class="benefit-chip"><i class="fas fa-check"></i> Priority Booking</div>
            <div class="benefit-chip"><i class="fas fa-check"></i> Medical Records</div>
            <div class="benefit-chip"><i class="fas fa-check"></i> Ride History</div>
            <div class="benefit-chip"><i class="fas fa-check"></i> Family Accounts</div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="firstName">First Name *</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="firstName" class="form-input" placeholder="First name" required />
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="lastName">Last Name *</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="lastName" class="form-input" placeholder="Last name" required />
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="regEmail">Email *</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="regEmail" class="form-input" placeholder="you@example.com" required />
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Account Type *</label>
            <div style="display:flex;gap:1rem;margin-bottom:1rem">
                <label style="color:var(--text-white);font-size:0.9rem"><input type="radio" name="regRole" value="patient" checked> Patient</label>
                <label style="color:var(--text-white);font-size:0.9rem"><input type="radio" name="regRole" value="provider"> Ambulance Provider</label>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="regPhone">Mobile Number *</label>
            <div class="input-wrapper" style="display:flex;gap:.5rem">
                <input type="tel" id="regPhone" class="form-input" placeholder="+91 98765 43210" required />
                <button class="btn btn-outline-red" id="sendOtpBtn" type="button"
                    style="flex-shrink:0;border-radius:var(--radius-md);padding:.5rem 1rem;font-size:.82rem;">Send
                    OTP</button>
            </div>
        </div>

        <div class="otp-section" id="otpSection">
            <label class="form-label">Enter OTP sent to your number</label>
            <div class="otp-strip">
                <input type="text" maxlength="1" class="otp-input" id="otp1" />
                <input type="text" maxlength="1" class="otp-input" id="otp2" />
                <input type="text" maxlength="1" class="otp-input" id="otp3" />
                <input type="text" maxlength="1" class="otp-input" id="otp4" />
                <input type="text" maxlength="1" class="otp-input" id="otp5" />
                <input type="text" maxlength="1" class="otp-input" id="otp6" />
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="regPassword">Create Password *</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="regPassword" class="form-input" placeholder="Min 8 characters" required />
            </div>
            <div class="pw-strength">
                <div class="strength-bar" id="sb1"></div>
                <div class="strength-bar" id="sb2"></div>
                <div class="strength-bar" id="sb3"></div>
                <div class="strength-bar" id="sb4"></div>
            </div>
            <div class="pw-strength-label" id="strengthLabel">Enter password</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="bloodGroup">Blood Group</label>
            <div class="input-wrapper">
                <i class="fas fa-droplet input-icon"></i>
                <select id="bloodGroup" class="form-input form-select">
                    <option value="">Select (optional)</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>
            </div>
        </div>
        <div class="terms-check">
            <input type="checkbox" id="termsCheck" />
            <label for="termsCheck">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                I consent to receive emergency alerts.</label>
        </div>
        <button class="btn-auth" id="registerBtn" type="button">Create Free Account</button>

        <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script>
        const sendOtpButton = document.getElementById('sendOtpBtn');
        const phoneInput = document.getElementById('regPhone');
        const otpSection = document.getElementById('otpSection');
        const firstOtpInput = document.getElementById('otp1');

        if (sendOtpButton && phoneInput && otpSection) {
            sendOtpButton.addEventListener('click', () => {
                const phoneNumber = phoneInput.value.trim();
                
                const isPhoneNumberMissing = !phoneNumber;
                if (isPhoneNumberMissing) {
                    showToast('Enter your phone number first.', 'error');
                    return;
                }
                
                otpSection.classList.add('visible');
                showToast(`OTP sent to ${phoneNumber}`, 'success');
                
                if (firstOtpInput) {
                    firstOtpInput.focus();
                }
            });
        }

        const allOtpInputs = document.querySelectorAll('.otp-input');
        
        allOtpInputs.forEach((currentInput, currentIndex) => {
            currentInput.addEventListener('input', () => {
                const isValueEntered = currentInput.value;
                const nextInputExists = allOtpInputs[currentIndex + 1];
                
                if (isValueEntered && nextInputExists) {
                    allOtpInputs[currentIndex + 1].focus();
                }
            });
            
            currentInput.addEventListener('keydown', (event) => {
                const isBackspacePressed = event.key === 'Backspace';
                const isEmptyField = !currentInput.value;
                const previousInputExists = allOtpInputs[currentIndex - 1];
                
                if (isBackspacePressed && isEmptyField && previousInputExists) {
                    allOtpInputs[currentIndex - 1].focus();
                }
            });
        });

        const passwordInput = document.getElementById('regPassword');
        
        if (passwordInput) {
            passwordInput.addEventListener('input', function () {
                const currentPassword = this.value;
                const strengthBars = [
                    document.getElementById('sb1'), 
                    document.getElementById('sb2'), 
                    document.getElementById('sb3'), 
                    document.getElementById('sb4')
                ];
                
                let passwordStrengthScore = 0;
                
                const isMinimumLength = currentPassword.length >= 6;
                if (isMinimumLength) passwordStrengthScore++;
                
                const isGoodLength = currentPassword.length >= 10;
                if (isGoodLength) passwordStrengthScore++;
                
                const hasUppercaseAndNumbers = /[A-Z]/.test(currentPassword) && /[0-9]/.test(currentPassword);
                if (hasUppercaseAndNumbers) passwordStrengthScore++;
                
                const hasSpecialCharacters = /[^A-Za-z0-9]/.test(currentPassword);
                if (hasSpecialCharacters) passwordStrengthScore++;
                
                const strengthClasses = ['weak', 'weak', 'medium', 'strong'];
                const strengthLabels = ['Too short', 'Weak', 'Medium', 'Strong!'];
                
                strengthBars.forEach((bar, index) => {
                    const shouldFillBar = index < passwordStrengthScore;
                    const classToApply = shouldFillBar ? ` ${strengthClasses[passwordStrengthScore - 1]}` : '';
                    bar.className = `strength-bar${classToApply}`;
                });
                
                const labelElement = document.getElementById('strengthLabel');
                if (labelElement) {
                    labelElement.textContent = passwordStrengthScore > 0 ? strengthLabels[passwordStrengthScore - 1] : 'Enter password';
                }
            });
        }

        const registerButton = document.getElementById('registerBtn');
        
        if (registerButton) {
            registerButton.addEventListener('click', async () => {
                const firstNameInput = document.getElementById('firstName');
                const lastNameInput = document.getElementById('lastName');
                const emailInput = document.getElementById('regEmail');
                const phoneInput = document.getElementById('regPhone');
                const passwordInput = document.getElementById('regPassword');
                const roleInput = document.querySelector('input[name="regRole"]:checked');
                const termsCheckbox = document.getElementById('termsCheck');
                
                const firstName = firstNameInput.value.trim();
                const lastName = lastNameInput.value.trim();
                const emailAddress = emailInput.value.trim();
                const phoneNumber = phoneInput.value.trim();
                const userPassword = passwordInput.value;
                const userRole = roleInput ? roleInput.value : 'patient';
                const isTermsAccepted = termsCheckbox.checked;
                
                const isMissingRequiredFields = !firstName || !emailAddress || !phoneNumber || !userPassword;
                if (isMissingRequiredFields) {
                    showToast('Please fill all required fields.', 'error');
                    return;
                }
                
                const isPasswordTooShort = userPassword.length < 6;
                if (isPasswordTooShort) {
                    showToast('Password must be at least 6 characters.', 'error');
                    return;
                }
                
                if (!isTermsAccepted) {
                    showToast('Please accept the Terms of Service.', 'error');
                    return;
                }
                
                registerButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
                registerButton.disabled = true;
                
                try {
                    const fullName = `${firstName} ${lastName}`;
                    const registrationRequest = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: fullName,
                            email: emailAddress,
                            phone: phoneNumber,
                            password: userPassword,
                            role: userRole
                        })
                    };
                    
                    const serverResponse = await fetch(`${API_BASE_URL}/auth/register`, registrationRequest);
                    const responseData = await serverResponse.json();
                    
                    if (!serverResponse.ok) {
                        throw new Error(responseData.error || 'Registration failed.');
                    }
                    
                    localStorage.setItem('rr_token', responseData.token);
                    localStorage.setItem('rr_user', JSON.stringify(responseData.user));
                    
                    showToast(`Welcome to Rapid Rescue, ${firstName}! 🚑`, 'success');
                    
                    setTimeout(() => {
                        window.location.href = responseData.user.role === 'provider' ? 'admin.html' : 'index.html';
                    }, 1500);
                    
                } catch (error) {
                    showToast(error.message, 'error');
                    registerButton.innerHTML = 'Create Free Account';
                    registerButton.disabled = false;
                }
            });
        }
    </script>
</body>

</html>
