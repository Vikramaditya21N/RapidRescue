<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your Rapid Rescue account." />
    <title>Login | Rapid Rescue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
</head>

<body class="auth-page-body">
    <nav class="navbar scrolled"
        style="background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:var(--border-glass)">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon"><i class="fas fa-ambulance"></i></div>
                <span class="brand-text">Rapid<span class="brand-accent">Rescue</span></span>
            </a>
        </div>
    </nav>

    <div class="auth-card">
        <div class="auth-logo">
            <div class="brand-icon"><i class="fas fa-ambulance"></i></div>
            <span class="brand-text">Rapid<span class="brand-accent">Rescue</span></span>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to manage your bookings and health profile</p>

        <div class="emergency-strip">
            <i class="fas fa-circle-exclamation"></i>
            <span>Emergency? Don't wait — <a href="booking.html">Book instantly without login</a></span>
        </div>

        <div class="form-group">
            <label class="form-label" for="loginPhone">Mobile Number *</label>
            <div class="input-wrapper" style="display:flex;gap:.5rem">
                <i class="fas fa-phone input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-gray);"></i>
                <input type="tel" id="loginPhone" class="form-input" style="padding-left: 2.5rem;" placeholder="+91 98765 43210" required />
                <button class="btn btn-outline-red" id="sendLoginOtpBtn" type="button"
                    style="flex-shrink:0;border-radius:var(--radius-md);padding:.5rem 1rem;font-size:.82rem;">Send OTP</button>
            </div>
        </div>

        <div class="otp-section" id="loginOtpSection" style="display: none; margin-bottom: 1.5rem;">
            <label class="form-label">Enter OTP sent to your number</label>
            <div class="otp-strip" style="display: flex; gap: 0.5rem; justify-content: space-between;">
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp1" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp2" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp3" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp4" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp5" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
                <input type="text" maxlength="1" class="otp-input login-otp-input" id="lotp6" style="width: 2.5rem; height: 3rem; text-align: center; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: white; font-size: 1.2rem;" />
            </div>
        </div>

        <button class="btn-auth" id="loginBtn" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">Sign In</button>

        <div class="auth-footer" style="margin-top: 1.5rem;">
            Don't have an account? <a href="register.html">Create one free</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script>
        const sendOtpButton = document.getElementById('sendLoginOtpBtn');
        const phoneInput = document.getElementById('loginPhone');
        const otpSection = document.getElementById('loginOtpSection');
        const loginButton = document.getElementById('loginBtn');
        const otpInputs = document.querySelectorAll('.login-otp-input');

        if (sendOtpButton && phoneInput && otpSection) {
            sendOtpButton.addEventListener('click', async () => {
                const phoneNumber = phoneInput.value.trim();
                
                if (!phoneNumber) {
                    showToast('Enter your mobile number first.', 'error');
                    return;
                }
                
                sendOtpButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                sendOtpButton.disabled = true;

                try {
                    const otpRequest = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phoneNumber })
                    };
                    
                    const serverResponse = await fetch(`${API_BASE_URL}/auth/send-login-otp`, otpRequest);
                    const responseData = await serverResponse.json();
                    
                    if (!serverResponse.ok) {
                        throw new Error(responseData.error || 'Failed to send OTP.');
                    }

                    otpSection.style.display = 'block';
                    loginButton.disabled = false;
                    loginButton.style.opacity = '1';
                    loginButton.style.cursor = 'pointer';
                    
                    showToast('OTP sent via SMS!', 'success');
                    
                    if (otpInputs.length > 0) {
                        otpInputs[0].focus();
                    }
                } catch (error) {
                    showToast(error.message, 'error');
                } finally {
                    sendOtpButton.innerHTML = 'Send OTP';
                    sendOtpButton.disabled = false;
                }
            });
        }

        // OTP input behavior
        otpInputs.forEach((currentInput, currentIndex) => {
            currentInput.addEventListener('input', () => {
                const isValueEntered = currentInput.value;
                const nextInputExists = otpInputs[currentIndex + 1];
                if (isValueEntered && nextInputExists) {
                    otpInputs[currentIndex + 1].focus();
                }
            });
            
            currentInput.addEventListener('keydown', (event) => {
                if (event.key === 'Backspace' && !currentInput.value && otpInputs[currentIndex - 1]) {
                    otpInputs[currentIndex - 1].focus();
                }
            });
        });

        if (loginButton) {
            loginButton.addEventListener('click', async () => {
                const phoneNumber = phoneInput.value.trim();
                let otpValue = '';
                otpInputs.forEach(input => { otpValue += input.value; });
                
                if (!phoneNumber || otpValue.length < 6) {
                    showToast('Please enter your phone number and the 6-digit OTP.', 'error');
                    return;
                }
                
                loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
                loginButton.disabled = true;
                
                try {
                    const authenticationRequest = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phoneNumber, otp: otpValue })
                    };
                    
                    const serverResponse = await fetch(`${API_BASE_URL}/auth/login-with-otp`, authenticationRequest);
                    const responseData = await serverResponse.json();
                    
                    if (!serverResponse.ok) {
                        throw new Error(responseData.error || 'Login failed.');
                    }
                    
                    localStorage.setItem('rr_token', responseData.token);
                    localStorage.setItem('rr_user', JSON.stringify(responseData.user));
                    
                    showToast(`Welcome back, ${responseData.user.name}! 🚑`, 'success');
                    
                    setTimeout(() => {
                        window.location.href = responseData.user.role === 'provider' ? 'admin.html' : 'index.html';
                    }, 1200);
                    
                } catch (error) {
                    showToast(error.message, 'error');
                    loginButton.innerHTML = 'Sign In';
                    loginButton.disabled = false;
                }
            });
        }
    </script>
</body>

</html>
